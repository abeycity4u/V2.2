name: Package V2.2.46 cPanel ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-v2246-cpanel.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V2.2.46 deployment markers
        run: |
          set -e
          php -l management/sales_report_pdf.php
          php -l management/expense_report_pdf.php
          php -l management/sales_records.php
          php -l management/expenses.php
          grep -q "sales_report_pdf.php" management/sales_records.php
          grep -q "expense_report_pdf.php" management/expenses.php
          grep -q "PDF Debt History" management/sales_records.php
          ! grep -q "stripActionsColumns(" includes/pdf/PdfReportService.php
          php scripts/verify_v2240_receivable_payment_overpayment_protection.php
      - name: Build cPanel ZIP
        run: |
          set -e
          rm -rf /tmp/renee-v2246
          mkdir -p /tmp/renee-v2246
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/renee-v2246/
          cd /tmp/renee-v2246
          zip -qr "$GITHUB_WORKSPACE/Renee-Farms-V2.2.46-cPanel.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Renee-Farms-V2.2.46-cPanel
          path: Renee-Farms-V2.2.46-cPanel.zip
          retention-days: 7
