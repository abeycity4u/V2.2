name: Finalize V2.2.42 centralized PDF engine

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_v2242_pdf_handler.py'
      - '.github/workflows/apply-v2242-pdf-engine-final.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V2.2.42 migration
        run: |
          python3 scripts/implement_v2242_pdf.py
          python3 scripts/fix_v2242_pdf_handler.py

      - name: Install production PDF dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Verify V2.2.42 and receivables regression
        run: |
          php scripts/verify_v2242_pdf_engine.php
          php scripts/verify_v2240_receivable_payment_overpayment_protection.php
          php -l includes/pdf/PdfReportService.php
          php -l management/sales_records.php
          php -l management/expenses.php
          php -l management/poultry_ruminant_report.php

      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock vendor includes/pdf management/sales_records.php management/expenses.php management/poultry_ruminant_report.php scripts/verify_v2242_pdf_engine.php DEPLOYMENT_V2.2.42.md V2_CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: V2.2.42 centralized application PDF report engine"
          git push
