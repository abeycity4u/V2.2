name: Apply V2.2.41 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v2241.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_v2241_patch.py
      - name: Verify V2.2.41
        run: php scripts/verify_v2241_sales_print_layout.php
      - name: Regression verify V2.2.40
        run: php scripts/verify_v2240_receivable_payment_overpayment_protection.php
      - name: PHP syntax
        run: php -l management/sales_records.php
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-v2241.yml scripts/apply_v2241_patch.py
          git add -A
          git commit -m "fix: V2.2.41 Sales Report print layout stabilization"
          git push origin HEAD:main
