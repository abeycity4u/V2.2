name: Apply V2.2.40 patch

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name != 'issues' || github.event.issue.title == 'APPLY_V2240_PATCH'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V2.2.40 source patch
        run: python3 scripts/patch_v2240_repo.py

      - name: Validate PHP syntax
        run: php -l management/sales_records.php

      - name: Commit V2.2.40 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add management/sales_records.php
          git commit -m 'fix: V2.2.40 receivable payment overpayment protection'
          git push origin HEAD:main
